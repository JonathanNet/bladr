name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust version
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Rename executable
        shell: pwsh
        run: Copy-Item target/release/bladr.exe Bladr.exe

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Get-Content Cargo.toml -Raw | Select-String -Pattern 'version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          & $iscc.FullName "/DMyAppVersion=$version" "installer\bladr.iss"
          cargo build --release --locked --manifest-path installer\launcher\Cargo.toml
          Copy-Item installer\launcher\target\release\bladr-setup-launcher.exe "installer\Output\Bladr-$version-Setup.exe"
          Remove-Item "installer\Output\*-Setup-inner.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bladr-windows-x64
          path: |
            Bladr.exe
            installer/Output/Bladr-*-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Bladr.exe
            installer/Output/Bladr-*-Setup.exe
          generate_release_notes: true
